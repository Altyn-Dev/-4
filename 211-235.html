<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Решения JavaScript №211–235</title><style>body{font:16px Arial;background:#f4f6fb;color:#182338;margin:0}header{background:#172c52;color:white;padding:25px}main{max-width:1050px;margin:auto;padding:18px}.task{background:white;border-radius:12px;padding:18px;margin:16px 0;box-shadow:0 2px 8px #ccd3df}h2{color:#214d91}button{background:#2459aa;color:white;border:0;padding:9px 14px;border-radius:6px;cursor:pointer;margin:4px}input,select,textarea{padding:9px;margin:4px;border:1px solid #adb7c9;border-radius:5px}pre,.output{background:#eef3fa;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:6px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #cbd3df;padding:8px;text-align:left}.cards{display:flex;flex-wrap:wrap;gap:8px}.device{border:1px solid #b8c7db;padding:12px;border-radius:8px}small{color:#52637b}</style><header><h1>Практические задания JavaScript №211–235</h1><p>Все 25 решений в одном HTML-файле. Откройте файл в браузере; задания 211–230 запускаются кнопками, задания 231–235 интерактивны.</p></header><main><div id="basic"></div><div id="projects"></div></main><script>
const $=id=>document.getElementById(id), fmt=n=>Number(n.toFixed(2));
const tasks=[
[211,'Проверка токенов',()=>{let tokens=1500;return tokens<0?'Ошибка: отрицательное значение':tokens===0?'Лимит исчерпан':tokens<=100?'Критически мало токенов':tokens<=1000?'Токены заканчиваются':'Достаточно токенов'}],
[212,'Готовность задания',()=>{let codeCompleted=true,tested=false;return codeCompleted&&tested?'Задание готово к отправке':!codeCompleted?'Завершите программирование':'Необходимо тестирование'}],
[213,'Тариф сервера',()=>{let ram=16;if(ram<=0)return 'Некорректный объём RAM';let cost=ram<=4?3000:ram<=8?5000:ram<=16?9000:15000;return `RAM: ${ram} ГБ; месяц: ${cost} ₸; 6 месяцев: ${cost*6} ₸`}],
[214,'Ошибки в коде',()=>{let errors=3;return errors<0?'Ошибка данных':errors===0?'Отличный код':errors<=2?'Незначительные ошибки':errors<=5?'Требуется исправление':'Необходимо переработать программу'}],
[215,'Статус заявки',()=>{let status=3;switch(status){case 1:return 'Новая';case 2:return 'На рассмотрении';case 3:return 'Одобрена';case 4:return 'Отклонена';case 5:return 'Выполнена';default:return 'Неизвестный код'}}],
[216,'Результаты студентов',()=>{let a=[95,82,47,75,100,68,55,91,39,84];return `Студентов: ${a.length}; средний балл: ${fmt(a.reduce((s,x)=>s+x,0)/a.length)}; 90+: ${a.filter(x=>x>=90).length}; ниже 50: ${a.filter(x=>x<50).length}; максимум: ${Math.max(...a)}; минимум: ${Math.min(...a)}`}],
[217,'Кабинеты',()=>{let rooms=[];for(let i=201;i<=215;i++)rooms.push(i);return `Все: ${rooms.join(', ')}\nЧётные: ${rooms.filter(x=>x%2===0).join(', ')}\nКоличество: ${rooms.length}`}],
[218,'Название проекта',()=>{let s='Artificial Intelligence';return `Символов: ${s.length}; пробелов: ${(s.match(/ /g)||[]).length}; букв: ${s.replace(/ /g,'').length}; букв i: ${(s.match(/i/gi)||[]).length}`}],
[219,'Цены устройств',()=>{let a=[85000,250000,120000,460000,95000,310000],sorted=[...a].sort((x,y)=>y-x),top=sorted.slice(0,3);return `По убыванию: ${sorted.join(', ')}\nТоп-3: ${top.join(', ')}\nСумма топ-3: ${top.reduce((s,x)=>s+x,0)} ₸\nСредняя: ${fmt(a.reduce((s,x)=>s+x,0)/a.length)} ₸`}],
[220,'Выполненные задачи',()=>{let a=[4,7,5,9,3,8,6],sum=a.reduce((s,x)=>s+x,0);return `Всего: ${sum}; максимум: ${Math.max(...a)}; минимум: ${Math.min(...a)}; среднее: ${fmt(sum/a.length)}; дней >5: ${a.filter(x=>x>5).length}`}],
[221,'JavaScript-файлы',()=>{let a=['index.html','style.css','app.js','script.js','photo.png','main.js'],js=a.filter(x=>x.endsWith('.js'));return `Файлы: ${js.join(', ')}; количество: ${js.length}`}],
[222,'Время алгоритмов',()=>{let a=[120,85,230,95,150,70,180];return `Минимум: ${Math.min(...a)} мс; максимум: ${Math.max(...a)} мс; среднее: ${fmt(a.reduce((s,x)=>s+x,0)/a.length)} мс; более 150 мс: ${a.filter(x=>x>150).join(', ')}; количество: ${a.filter(x=>x>150).length}`}],
[223,'Случайные оценки',()=>{let a=[];for(let i=0;i<15;i++)a.push(Math.floor(Math.random()*101));return `Оценки: ${a.join(', ')}\nСредний балл: ${fmt(a.reduce((s,x)=>s+x,0)/a.length)}; сдали (50+): ${a.filter(x=>x>=50).length}`}],
[224,'Стоимость ИИ',()=>{function calculateAICost(tokens,rate){if(!Number.isFinite(tokens)||!Number.isFinite(rate)||tokens<0||rate<0)throw Error('Неверные аргументы');return tokens/1000*rate}return `Стоимость: ${calculateAICost(12500,8)} ₸`}],
[225,'Загрузка кабинетов',()=>{let a=[{number:201,total:24,occupied:18},{number:202,total:20,occupied:20},{number:203,total:25,occupied:12},{number:204,total:24,occupied:22}];function analyzeRooms(rooms){return rooms.map(r=>`Кабинет ${r.number}: ${fmt(r.occupied/r.total*100)}%`).join('\n')+`\nПолностью заняты: ${rooms.filter(r=>r.occupied===r.total).map(r=>r.number).join(', ')}\nБольше всего свободных: ${[...rooms].sort((a,b)=>(b.total-b.occupied)-(a.total-a.occupied))[0].number}\nВсего свободных: ${rooms.reduce((s,r)=>s+r.total-r.occupied,0)}`}return analyzeRooms(a)}],
[226,'Активность пользователей',()=>{let a=[{name:'Алия',requests:25},{name:'Арман',requests:12},{name:'Мадина',requests:48},{name:'Данияр',requests:7}],sum=a.reduce((s,x)=>s+x.requests,0),rank=[...a].sort((x,y)=>y.requests-x.requests);return `Всего: ${sum}; среднее: ${fmt(sum/a.length)}; лидер: ${rank[0].name}; больше 20: ${a.filter(x=>x.requests>20).map(x=>x.name).join(', ')}\nРейтинг:\n${rank.map(x=>x.name+': '+x.requests).join('\n')}`}],
[227,'Бюджет IT-проекта',()=>{let a=[{name:'Разработка',cost:200000},{name:'Дизайн',cost:80000},{name:'Сервер',cost:50000},{name:'Тестирование',cost:70000}];function calculateBudget(b){let sum=b.reduce((s,x)=>s+x.cost,0);return `Бюджет: ${sum} ₸; крупнейшая статья: ${[...b].sort((x,y)=>y.cost-x.cost)[0].name}; превышает 350000: ${sum>350000?'да':'нет'}\n${b.map(x=>x.name+': '+fmt(x.cost/sum*100)+'%').join('\n')}`}return calculateBudget(a)}],
[228,'Мониторинг роботов',()=>{let a=[{name:'Robot A',battery:95,online:true},{name:'Robot B',battery:15,online:true},{name:'Robot C',battery:70,online:false},{name:'Robot D',battery:45,online:true}];function checkRobots(r){return `Онлайн: ${r.filter(x=>x.online).map(x=>x.name).join(', ')}\nНизкий заряд: ${r.filter(x=>x.battery<20).map(x=>x.name).join(', ')}\nОфлайн: ${r.filter(x=>!x.online).map(x=>x.name).join(', ')}\nСредний заряд: ${fmt(r.reduce((s,x)=>s+x.battery,0)/r.length)}%`}return checkRobots(a)}],
[229,'Онлайн-курсы',()=>{let a=[{title:'JavaScript',enrolled:30,completed:24},{title:'Python',enrolled:25,completed:20},{title:'AI Basics',enrolled:40,completed:35},{title:'HTML',enrolled:20,completed:12}],sorted=[...a].sort((x,y)=>y.completed/y.enrolled-x.completed/x.enrolled),total=a.reduce((s,x)=>s+x.enrolled,0),completed=a.reduce((s,x)=>s+x.completed,0);return `${a.map(x=>x.title+': '+fmt(x.completed/x.enrolled*100)+'%').join('\n')}\nЛучший: ${sorted[0].title}; худший: ${sorted.at(-1).title}; регистраций: ${total}; общий процент: ${fmt(completed/total*100)}%`}],
[230,'Задачи команды',()=>{let a=[{name:'Алия',tasks:5},{name:'Руслан',tasks:8},{name:'Арман',tasks:3},{name:'Мадина',tasks:6}];function analyzeTeam(t){let sum=t.reduce((s,x)=>s+x.tasks,0),sorted=[...t].sort((x,y)=>y.tasks-x.tasks);return `Всего: ${sum}; максимум: ${sorted[0].name}; минимум: ${sorted.at(-1).name}; среднее: ${fmt(sum/t.length)}\n${t.map(x=>x.name+': '+x.tasks).join('\n')}`}function assignTask(name){let person=a.find(x=>x.name===name);if(person)person.tasks++}assignTask('Арман');return analyzeTeam(a)}]
];
for(const [n,title,fn] of tasks){let section=document.createElement('section');section.className='task';section.innerHTML=`<h2>№${n}. ${title}</h2><button>Запустить решение</button><pre class="output">Нажмите кнопку для выполнения</pre>`;section.querySelector('button').onclick=()=>{try{section.querySelector('pre').textContent=fn()}catch(e){section.querySelector('pre').textContent='Ошибка: '+e.message}};$('basic').append(section)}
const questions=[['Как объявить переменную?',['let','print','echo','def'],0],['Строгое равенство?',['=','==','===','!='],2],['Метод добавления в массив?',['push','pop','shift','join'],0],['Тип true?',['number','boolean','string','object'],1],['Цикл со счётчиком?',['if','for','switch','return'],1],['Преобразование строки в число?',['Number','String','Boolean','Array'],0],['Получение элемента по id?',['getElementById','queryAll','createText','append'],0],['Оператор И?',['||','&&','!','??'],1],['Длина массива?',['size','count','length','index'],2],['Хранение данных браузера?',['localStorage','console','alert','prompt'],0]];
let qi=0,score=0,answered=false;
function showQuestion(){if(qi>=questions.length){$('quiz').innerHTML=`Результат: ${score}/10 (${score*10}%). Оценка: ${score>=9?'5':score>=7?'4':score>=5?'3':'2'} <button onclick="restartQuiz()">Пройти снова</button>`;return}let q=questions[qi];$('quiz').innerHTML=`<b>Вопрос ${qi+1}/10: ${q[0]}</b><div>${q[1].map((x,i)=>`<label style="display:block"><input type="radio" name="answer" value="${i}">${x}</label>`).join('')}</div><button onclick="nextQuestion()">Следующий вопрос</button><small id="quizmsg"></small>`}
function nextQuestion(){let chosen=document.querySelector('input[name=answer]:checked');if(!chosen){$('quizmsg').textContent=' Выберите ответ';return}if(+chosen.value===questions[qi][2])score++;qi++;showQuestion()}function restartQuiz(){qi=0;score=0;showQuestion()}
let applications=JSON.parse(localStorage.getItem('applications211')||'[]');function saveApps(){localStorage.setItem('applications211',JSON.stringify(applications));renderApps()};function addApp(){let name=$('equip').value.trim(),date=$('appdate').value,purpose=$('purpose').value.trim();if(!name||!date||!purpose){alert('Заполните все поля');return}applications.push({id:Date.now(),name,date,purpose,status:'Новая'});$('equip').value='';$('purpose').value='';saveApps()}function updateApp(id,value){applications.find(x=>x.id===id).status=value;saveApps()}function renderApps(){let q=$('appsearch').value.toLowerCase();$('apptable').innerHTML='<tr><th>Оборудование</th><th>Дата</th><th>Цель</th><th>Статус</th></tr>'+applications.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.date)}</td><td>${esc(x.purpose)}</td><td><select onchange="updateApp(${x.id},this.value)">${['Новая','На рассмотрении','Одобрена','Отклонена','Выполнена'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}
let students=[{name:'Алия',score:95,attendance:98},{name:'Арман',score:47,attendance:70},{name:'Мадина',score:88,attendance:92},{name:'Данияр',score:64,attendance:83},{name:'Руслан',score:39,attendance:65}];function renderStudents(){let a=students.filter(x=>x.name.toLowerCase().includes($('studentsearch').value.toLowerCase()));if($('studentsort').value==='score')a=[...a].sort((x,y)=>y.score-x.score);$('studenttable').innerHTML='<tr><th>Имя</th><th>Балл</th><th>Посещаемость</th></tr>'+a.map(x=>`<tr><td>${x.name}</td><td>${x.score}</td><td>${x.attendance}%</td></tr>`).join('');$('studentstats').textContent=`Средний балл: ${fmt(students.reduce((s,x)=>s+x.score,0)/students.length)}; посещаемость: ${fmt(students.reduce((s,x)=>s+x.attendance,0)/students.length)}%; ниже 50: ${students.filter(x=>x.score<50).map(x=>x.name).join(', ')}`;$('studentchart').innerHTML=a.map(x=>`<div>${x.name}: ${x.score}<div style="background:#dce5f5;height:15px"><div style="background:#346bb9;width:${x.score}%;height:100%"></div></div></div>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sendChat(){let v=$('chatinput').value.trim();if(!v)return;let t=v.toLowerCase(),answer=t.includes('javascript')||t.includes('js')?'JavaScript добавляет интерактивность веб-страницам.':t.includes('html')?'HTML задаёт структуру страницы.':t.includes('css')?'CSS отвечает за оформление страницы.':'Я пока не знаю ответа';$('chatlog').innerHTML+=`<p><b>Вы (${new Date().toLocaleTimeString()}):</b> ${esc(v)}</p><p><b>Помощник:</b> ${esc(answer)}</p>`;$('chatinput').value=''}
let computers=JSON.parse(localStorage.getItem('computers235')||'null')||[{number:1,room:201,ok:true,issue:''},{number:2,room:201,ok:false,issue:'Не включается'},{number:3,room:202,ok:true,issue:''},{number:4,room:202,ok:true,issue:''}];function savePC(){localStorage.setItem('computers235',JSON.stringify(computers));renderPC()}function togglePC(n){let x=computers.find(x=>x.number===n);x.ok=!x.ok;if(x.ok)x.issue='';savePC()}function addIssue(){let n=Number($('pcnumber').value),issue=$('pcissue').value.trim(),x=computers.find(x=>x.number===n);if(!x||!issue){alert('Укажите существующий номер и описание неисправности');return}x.ok=false;x.issue=issue;$('pcissue').value='';savePC()}function renderPC(){let q=$('pcsearch').value,filter=$('pcfilter').value,a=computers.filter(x=>String(x.number).includes(q)&&(filter==='all'||(filter==='ok')===x.ok));$('pcstats').textContent=`Исправных: ${computers.filter(x=>x.ok).length} из ${computers.length}; процент исправности: ${fmt(computers.filter(x=>x.ok).length/computers.length*100)}%`;$('pccards').innerHTML=a.map(x=>`<div class="device"><b>Компьютер №${x.number}</b><p>Кабинет ${x.room}</p><p>${x.ok?'Исправен':'Неисправен: '+esc(x.issue)}</p><button onclick="togglePC(${x.number})">Изменить состояние</button></div>`).join('')}
function exportPC(){let csv='Номер;Кабинет;Состояние;Неисправность\n'+computers.map(x=>`${x.number};${x.room};${x.ok?'Исправен':'Неисправен'};${x.issue.replace(/[;\r\n]/g,' ')}`).join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lab_report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('projects').innerHTML=`<section class="task"><h2>№231. Тест по JavaScript</h2><div id="quiz"></div></section><section class="task"><h2>№232. Заявки на оборудование</h2><input id="equip" placeholder="Оборудование"><input id="appdate" type="date"><input id="purpose" placeholder="Цель использования"><button onclick="addApp()">Подать заявку</button><p><input id="appsearch" placeholder="Поиск оборудования" oninput="renderApps()"></p><table id="apptable"></table></section><section class="task"><h2>№233. Статистика студентов</h2><input id="studentsearch" placeholder="Поиск по имени" oninput="renderStudents()"><select id="studentsort" onchange="renderStudents()"><option value="none">Без сортировки</option><option value="score">По баллу (убывание)</option></select><p id="studentstats"></p><table id="studenttable"></table><h3>Диаграмма успеваемости</h3><div id="studentchart"></div></section><section class="task"><h2>№234. Учебный чат-помощник</h2><div id="chatlog" class="output" style="min-height:90px"></div><input id="chatinput" placeholder="Спросите про HTML, CSS или JavaScript" style="width:60%" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">Отправить</button><button onclick="$('chatlog').innerHTML=''">Очистить чат</button></section><section class="task"><h2>№235. IT Laboratory Manager</h2><p id="pcstats"></p><input id="pcsearch" placeholder="Номер компьютера" oninput="renderPC()"><select id="pcfilter" onchange="renderPC()"><option value="all">Все</option><option value="ok">Исправные</option><option value="bad">Неисправные</option></select><div id="pccards" class="cards"></div><h3>Регистрация неисправности</h3><input id="pcnumber" type="number" placeholder="Номер компьютера"><input id="pcissue" placeholder="Описание неисправности"><button onclick="addIssue()">Сохранить</button><p><button onclick="exportPC()">Экспорт CSV</button></p></section>`;
showQuestion();renderApps();renderStudents();renderPC();
</script></html>
